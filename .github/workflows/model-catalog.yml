name: Update official model catalog

on:
  push:
    branches: [main]
    paths:
      - "models/**"
      - "scripts/build_model_manifest.py"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate models and calculate SHA-256
        run: python scripts/build_model_manifest.py models
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/manifest.json
          git diff --cached --quiet || (git commit -m "Update official model manifest" && git push)
